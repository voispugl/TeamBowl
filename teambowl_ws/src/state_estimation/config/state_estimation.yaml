diff_drive_odom:
  ros__parameters:
    left_wheel_vel_topic: /wheel_vel_left
    right_wheel_vel_topic: /wheel_vel_right
    imu_topic: /imu/data
    cmd_vel_fallback_topic: /cmd_vel
    odom_topic: /odom
    odom_frame: odom
    base_frame: base_link
    wheel_radius_m: 0.307975
    track_width_m: 0.5588
    left_sign: 1.0
    right_sign: -1.0
    use_imu_yaw_rate: true
    imu_timeout_s: 0.25
    wheel_timeout_s: 0.25
    use_cmd_vel_fallback: true
    cmd_vel_timeout_s: 0.25
    publish_tf: true
    publish_rate_hz: 50.0
    pose_covariance_diagonal: [0.05, 0.05, 99999.0, 99999.0, 99999.0, 0.1]
    twist_covariance_diagonal: [0.02, 0.02, 99999.0, 99999.0, 99999.0, 0.05]
