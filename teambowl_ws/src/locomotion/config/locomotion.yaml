hold_position_controller:
  ros__parameters:
    mode_topic: /robot_mode
    estop_topic: /estop
    joint_commands_topic: /joint_commands
    torque_ff: 1.0
    publish_rate_hz: 50.0
    rs00_joints: [joint_rs00_1, joint_rs00_2]
    rs00_kp: 20.0   # ankle position stiffness (RS00 range: 0–500)
    rs00_kd: 0.3    # ankle velocity damping  (RS00 range: 0–5)
    imu_topic: /imu/data
    leveling_enabled: true
    leveling_kp: 0.5          # position offset (rad) per rad of tilt — start low
    leveling_max_offset_rad: 0.2  # per-joint safety clamp
    leveling_alpha: 0.85      # low-pass filter (0=raw, 1=frozen); smooths accel noise

driving_leg_controller:
  ros__parameters:
    mode_topic: /robot_mode
    estop_topic: /estop
    joint_commands_topic: /joint_commands
    cmd_vel_topic: /cmd_vel
    publish_rate_hz: 50.0
    verbose: false

    # Brake mode: RS00 foot joints rotate to flat-sole (sandpaper) position when stopped
    rs00_joints: [joint_rs00_1, joint_rs00_2]
    rs00_brake_offsets: [-1.5708, 1.5708]  # −π/2 left (CCW), +π/2 right (CW)
    vel_stopped_threshold: 0.0             # switch to roller mode on any non-zero cmd_vel_safe
    brake_debounce_s: 0.3                  # seconds of zero-vel before switching to brake

    # Ground-force PI: adjusts RS04 torque_ff to maintain target effort on the ground
    target_ground_torque: 10.0  # Nm target mean effort across RS04 joints
    kp_gnd: 0.5
    ki_gnd: 0.1
    max_torque_ff_nm: 5.0

    # RS00 sole leveling: integrates RS00 torque → 0 so flat sole lies flush on ground
    kp_rs00_level: 0.05       # rad adjustment per Nm per second (negate if foot levels wrong way)
    max_rs00_level_rad: 0.5   # safety clamp on offset from nominal brake position

vel_cmd_mux:
  ros__parameters:
    mode_topic: /robot_mode
    teleop_topic: /cmd_vel_teleop
    auto_topic: /cmd_vel_auto
    estop_topic: /estop
    output_topic: /cmd_vel_selected
    teleop_timeout_s: 0.5
    auto_timeout_s: 0.5
    publish_rate_hz: 30.0
    debug: false

fall_recovery_controller:
  ros__parameters:
    pitch_trigger_rad: 0.45
    extend_rad: 0.524
    extend_time_s: 2.5
    retract_time_s: 0.35
    retract_undershoot_rad: 0.1
    recovery_kp: 200.0
    retract_kd: 2.0
    ground_settle_s: 1.5
    drive_back_speed_m_s: 0.3
    drive_back_dist_m: 0.5
    settle_time_s: 1.5
    control_rate_hz: 50.0
    cooldown_s: 3.0
    mode_topic: /robot_mode
    estop_topic: /estop

collision_guard:
  ros__parameters:
    input_topic: /cmd_vel_selected
    estop_topic: /estop
    output_topic: /cmd_vel_safe   # balance_controller subscribes here; it passes through to /cmd_vel
    max_linear_x: 2.0
    max_angular_z: 0.5
