# OAK-D PoE W config for Isaac ROS Visual SLAM + nvblox + YOLO26
#
# BEFORE FIRST USE: set i_ip to the camera's static IP address.
# Discover with: python3 -c "import depthai as dai; [print(d) for d in dai.Device.getAllAvailableDevices()]"
# Assign a static DHCP lease to the camera MAC address on your PoE switch so the IP never changes.
#
# Stereo at 90 Hz / 400p — uncompressed, required by Isaac ROS Visual SLAM.
# RGB at 15 Hz / 720p — H.264 on VPU dedicated encoder (does not compete with stereo SHAVE cores).
# IMU enabled — hardware-synced with stereo frames, used for VIO inside Visual SLAM.
# i_reverse_stereo_socket_order + i_publish_synced_rect_pair: required by Isaac VSLAM.
#
# VPU tuning: if stereo drops below 90 Hz (check: ros2 topic hz /oak/left/image_rect),
# disable i_subpixel first, then i_align_depth. The RGB H.264 encoder is NOT the cause.
/oak:
  ros__parameters:
    camera:
      i_nn_type: none
      i_enable_imu: true
      i_enable_ir: false
      i_pipeline_type: RGBD
      i_ip: "192.168.1.100"   # PLACEHOLDER — replace with actual static IP
    rgb:
      i_resolution: '720'
      i_fps: 15.0
      i_low_bandwidth: true
      i_low_bandwidth_quality: 50
      i_low_bandwidth_ffmpeg_encoder: "libx264"
    stereo:
      i_subpixel: true
      i_align_depth: true
      i_reverse_stereo_socket_order: true
      i_publish_synced_rect_pair: true
    left:
      i_resolution: '400'
      i_fps: 90.0
    right:
      i_resolution: '400'
      i_fps: 90.0
