plan_wheels:
  ros__parameters:
    target_topic: /user_pos
    target_valid_topic: /user_valid
    cmd_vel_topic: /cmd_vel_auto
    target_timeout_s: 0.5
    publish_rate_hz: 20.0
    follow_distance_m: 1.5
    distance_deadband_m: 0.15
    lateral_deadband_m: 0.10
    k_linear: 0.8
    k_angular: 1.8
    max_linear_x: 0.15
    max_angular_z: 0.8
    allow_reverse: true
    max_reverse_x: 0.15
    turn_in_place_angle_only: false
    turn_only_lateral_threshold_m: 0.5

nav_cloud_filter:
  ros__parameters:
    input_topic: /oak/points
    output_topic: /oak/nav_points
    target_frame: base_link
    transform_timeout_s: 0.1
    min_x_m: 0.00
    max_x_m: 5.00
    min_y_m: -2.50
    max_y_m: 2.50
    min_z_m: -0.10
    max_z_m: 5.00
    voxel_leaf_size_m: 0.3
    min_points_per_voxel: 1500

follow_goal:
  ros__parameters:
    target_topic: /user_pos
    target_valid_topic: /user_valid
    target_timeout_s: 0.5
    base_frame: base_link
    world_frame: odom
    transform_timeout_s: 0.1
    follow_distance_m: 1.5
    min_goal_distance_m: 0.25
    goal_lateral_deadband_m: 0.05
    goal_update_rate_hz: 10.0
    goal_smoothing_alpha: 0.35
    user_base_topic: /user_pos_base_link
    user_world_topic: /user_pos_odom
    goal_topic: /follow_goal

follow_executor:
  ros__parameters:
    goal_topic: /follow_goal
    goal_timeout_s: 0.75
    replan_rate_hz: 2.0
    min_goal_change_m: 0.10
    min_goal_change_rad: 0.20
    planner_action_name: /compute_path_to_pose
    controller_action_name: /follow_path
    planner_id: GridBased
    controller_id: FollowPath
    goal_checker_id: goal_checker
    debug_path_topic: /follow_path
    cmd_vel_topic: /cmd_vel_auto
    mode_topic: /robot_mode
    autonomous_mode_name: auton

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      downsample_costmap: false
      downsampling_factor: 1
      tolerance: 0.25
      allow_unknown: true
      max_iterations: 1000000
      max_planning_time: 5.0
      motion_model_for_search: "REEDS_SHEPP"  # supports forward + reverse arcs
      angle_quantization_bins: 36             # 10° resolution — faster startup
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.2          # meters — tune to robot's actual min radius
      reverse_penalty: 1.5                    # >1 prefers forward; 1.0 = equal cost
      change_penalty: 0.05                    # small cost for direction changes
      non_straight_penalty: 1.20
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
        do_refinement: true

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.05
    min_y_velocity_threshold: 0.05
    min_theta_velocity_threshold: 0.05
    failure_tolerance: 0.3
    odom_topic: /odometry/filtered
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.1

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 1.0
      min_lookahead_dist: 0.2
      max_lookahead_dist: 2.0
      use_velocity_scaled_lookahead_dist: true
      regulated_linear_scaling_min_radius: 0.9
      use_rotate_to_heading: false
      transform_tolerance: 0.2
      allow_reversing: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 10
      height: 10
      resolution: !!float 0.05
      robot_radius: 0.32
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 5
      height: 5
      resolution: !!float 0.05
      robot_radius: 0.32
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        observation_persistence: 0.0
        max_obstacle_height: 1.20
        observation_sources: oak_scan
        oak_scan:
          topic: /oak/nav_scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_min_range: 0.15
          obstacle_max_range: 2.00
          raytrace_min_range: 0.00
          raytrace_max_range: 2.50
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.3
        cost_scaling_factor: 3.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 20.0
    node_names: ["planner_server", "controller_server"]

trajectory_test:
  ros__parameters:
    planner_action_name: /compute_path_to_pose
    controller_action_name: /follow_path
    planner_id: GridBased
    controller_id: FollowPath
    goal_checker_id: goal_checker
    odom_topic: /odometry/filtered
    mode_topic: /robot_mode
    estop_topic: /estop
    path_topic: /trajectory_path
    status_topic: /trajectory_status
    goal_topic: /trajectory_goal
    cmd_topic: /trajectory_cmd
    cmd_vel_topic: /cmd_vel_auto
    replan_rate_hz: 2.0
    min_goal_change_m: 0.10
    min_goal_change_rad: 0.20
    odom_timeout_s: 0.5
