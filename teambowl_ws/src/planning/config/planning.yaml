plan_wheels:
  ros__parameters:
    target_topic: /user_pos
    target_valid_topic: /user_valid
    cmd_vel_topic: /cmd_vel_auto
    target_timeout_s: 0.5
    publish_rate_hz: 20.0
    follow_distance_m: 1.5
    distance_deadband_m: 0.15
    lateral_deadband_m: 0.10
    k_linear: 0.8
    k_angular: 1.8
    max_linear_x: 0.15
    max_angular_z: 0.8
    allow_reverse: false
    max_reverse_x: 0.15
    turn_in_place_angle_only: true
    turn_only_lateral_threshold_m: 0.5

nav_cloud_filter:
  ros__parameters:
    input_topic: /oak/points
    output_topic: /oak/nav_points
    target_frame: base_link
    transform_timeout_s: 0.1
    min_x_m: 0.15
    max_x_m: 2.50
    min_y_m: -1.20
    max_y_m: 1.20
    min_z_m: -0.10
    max_z_m: 1.20
    voxel_leaf_size_m: 0.08
    min_points_per_voxel: 3

follow_goal:
  ros__parameters:
    target_topic: /user_pos
    target_valid_topic: /user_valid
    target_timeout_s: 0.5
    base_frame: base_link
    world_frame: odom
    transform_timeout_s: 0.1
    follow_distance_m: 1.5
    min_goal_distance_m: 0.25
    goal_lateral_deadband_m: 0.05
    goal_update_rate_hz: 10.0
    goal_smoothing_alpha: 0.35
    user_base_topic: /user_pos_base_link
    user_world_topic: /user_pos_odom
    goal_topic: /follow_goal

follow_executor:
  ros__parameters:
    goal_topic: /follow_goal
    goal_timeout_s: 0.75
    replan_rate_hz: 2.0
    min_goal_change_m: 0.10
    min_goal_change_rad: 0.20
    planner_action_name: /compute_path_to_pose
    controller_action_name: /follow_path
    planner_id: GridBased
    controller_id: FollowPath
    goal_checker_id: goal_checker
    debug_path_topic: /follow_path
    cmd_vel_topic: /cmd_vel_auto
    mode_topic: /robot_mode
    autonomous_mode_name: auton

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]

    GridBased:
      plugin: "nav2_smac_planner/SmacPlanner2D"
      tolerance: 0.125                      # tolerance for planning if unable to reach exact pose, in meters
      downsample_costmap: false             # whether or not to downsample the map
      downsampling_factor: 1                # multiplier for the resolution of the costmap layer (e.g. 2 on a 5cm costmap would be 10cm)
      allow_unknown: true                   # allow traveling in unknown space
      max_iterations: 1000000               # maximum total iterations to search for before failing (in case unreachable), set to -1 to disable
      max_on_approach_iterations: 1000      # maximum number of iterations to attempt to reach goal once in tolerance
      max_planning_time: 2.0                # max time in s for planner to plan, smooth
      cost_travel_multiplier: 2.0           # Cost multiplier to apply to search to steer away from high cost areas. Larger values will place in the center of aisles more exactly (if non-`FREE` cost potential field exists) but take slightly longer to compute. To optimize for speed, a value of 1.0 is reasonable. A reasonable tradeoff value is 2.0. A value of 0.0 effective disables steering away from obstacles and acts like a naive binary search A*.
      use_final_approach_orientation: false # Whether to set the final path pose at the goal's orientation to the requested orientation (false) or in line with the approach angle so the robot doesn't rotate to heading (true)
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    odom_topic: /odometry/filtered
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.35

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.5
      lookahead_dist: 0.6
      min_lookahead_dist: 0.3
      max_lookahead_dist: 1.0
      use_velocity_scaled_lookahead_dist: true
      regulated_linear_scaling_min_radius: 0.9
      use_rotate_to_heading: true
      rotate_to_heading_angular_vel: 1.2
      transform_tolerance: 0.2
      allow_reversing: false

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 10
      height: 10
      resolution: !!float 0.05
      robot_radius: 0.32
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.55
        cost_scaling_factor: 3.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: false
      rolling_window: true
      width: 9
      height: 9
      resolution: !!float 0.05
      robot_radius: 0.32
      always_send_full_costmap: true
      plugins: ["voxel_layer", "inflation_layer"]
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 1.20
        mark_threshold: 2
        footprint_clearing_enabled: true
        observation_sources: oak_points
        oak_points:
          topic: /oak/nav_points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          inf_is_valid: false
          min_obstacle_height: -0.10
          max_obstacle_height: 1.20
          obstacle_min_range: 0.15
          obstacle_max_range: 2.50
          raytrace_min_range: 0.00
          raytrace_max_range: 3.00
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.3
        cost_scaling_factor: 3.0

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    node_names: ["planner_server", "controller_server"]
