pico_bridge:
  ros__parameters:
    # Full udev by-id path for the Pico — run `ls /dev/serial/by-id/` to find yours
    serial_port: "/dev/serial/by-id/usb-Raspberry_Pi_Pico_2_XXXX-if00"
    baud_rate: 115200
    cmd_vel_linear_threshold: 0.05   # m/s — below this is "stopped"
    cmd_vel_angular_threshold: 0.1   # rad/s — below this is "not turning"

heartbeat_publisher:
  ros__parameters:
    heartbeat_topic: /heartbeat
    publish_rate_hz: 10.0

system_health:
  ros__parameters:
    heartbeat_topic: /heartbeat
    estop_topic: /estop
    timeout_s: 1.0
    publish_rate_hz: 10.0
    start_estop_true: false
