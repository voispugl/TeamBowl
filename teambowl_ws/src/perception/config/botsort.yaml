tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 30        # ~6s at 5 Hz — enough for brief occlusion; longer risks ghost depth hits
match_thresh: 0.5       # IoU threshold for first-pass spatial association
fuse_score: True
gmc_method: sparseOptFlow  # global motion compensation (handles moving camera)

# ReID — disabled: ultralytics ReID uses a YOLO .pt as feature extractor, not an external model.
# Re-enable with_reid: True only if yolo26s.pt (PyTorch, not TRT) is available at model path.
proximity_thresh: 0.5
appearance_thresh: 0.25
with_reid: False
model: auto
