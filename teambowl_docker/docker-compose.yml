services:
  teambowl:
    build:
      context: .
      dockerfile: Dockerfile
    image: teambowl:dev
    container_name: teambowl_dev
    network_mode: host
    ipc: host
    stdin_open: true
    tty: true
    privileged: true
    stop_grace_period: 30s
    runtime: nvidia
    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/workspaces/teambowl_ws/fastdds_shm_profile.xml
      - RCUTILS_COLORIZE_OUTPUT=1
    volumes:
      - ${TEAMBOWL_WS:-/home/box/TeamBowl/teambowl_ws}:/workspaces/teambowl_ws
      - ${TEAMBOWL_MODELS:-/home/box/TeamBowl/models}:/home/box/TeamBowl/models
      - /dev:/dev
      # libcusparseLt: required by PyTorch 2.5.0 JetPack wheel, not in l4t-jetpack
      # base image — must be installed on host via JetPack SDK Manager first.
      - /usr/lib/aarch64-linux-gnu/libcusparseLt:/usr/lib/aarch64-linux-gnu/libcusparseLt:ro
    working_dir: /workspaces/teambowl_ws
    command: ros2 launch bringup bringup.launch.py use_vslam:=false use_yolo26:=true
